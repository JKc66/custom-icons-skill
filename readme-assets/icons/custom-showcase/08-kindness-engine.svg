<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Kindness Engine</title>
  <desc>Two asymmetric glazed ceramic paddles cooperatively engage an offset brushed brass gear, which supports a small coral sprout.</desc>
